version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/tfpath
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - repository:
      owner: winebarrel
      name: homebrew-tfpath
    homepage: https://github.com/winebarrel/tfpath
    description: Query values from Terraform configurations (including modules) as JSON.
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tfpath"]
          end
